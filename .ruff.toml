
target-version = "py310"
fix = true

[lint]
# Pin the base rule set instead of inheriting ruff's default. The 20.0 skeleton
# bumps ruff v0.13.0 -> v0.16.8, and 0.16.8 ships a much wider default; since
# this file only ever said `extend-select`, that drift silently switched on
# whole families the repo never chose (BLE, C4, DTZ, PIE, RUF, SIM). These four
# are ruff's classic default, so `select` plus the `extend-select` below
# reproduces exactly what v0.13.0 enforced on 19.0.
select = ["E4", "E7", "E9", "F"]
extend-select = [
    "B",
    "C90",
    "E501",  # line too long (default 88)
    "I",  # isort
    "UP",  # pyupgrade
]
extend-safe-fixes = ["UP008"]
exclude = ["setup/*"]

[format]
exclude = ["setup/*"]

[lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]  # ignore unused and unsorted imports in __init__.py
"__manifest__.py" = ["B018"]  # useless expression

[lint.isort]
section-order = ["future", "standard-library", "third-party", "odoo", "odoo-addons", "first-party", "local-folder"]

[lint.isort.sections]
"odoo" = ["odoo"]
"odoo-addons" = ["odoo.addons"]

[lint.mccabe]
max-complexity = 16
